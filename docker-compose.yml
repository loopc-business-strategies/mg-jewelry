services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mg
      POSTGRES_PASSWORD: mg_secret
      POSTGRES_DB: mg_jewelry
    ports:
      - "5432:5432"
    volumes:
      - mg_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mg_redis_data:/data

volumes:
  mg_pg_data:
  mg_redis_data:
