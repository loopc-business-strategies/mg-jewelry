# Railway config for API service (set railwayConfigFile to this path on the api service)
[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build -w @mg/shared && npm run railway:build -w @mg/api"

[deploy]
startCommand = "npm run railway:start -w @mg/api"
preDeployCommand = ["npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma"]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
